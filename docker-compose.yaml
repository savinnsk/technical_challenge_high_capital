services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5201:5201"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5212
      - ASPNETCORE_HTTPS_PORTS=5212
      - ASPNETCORE_URLS=http://0.0.0.0:5201
    volumes:
      - ./backend:/app
    working_dir: /app
    restart: always
    command: bash -c "dotnet restore && dotnet ef database update --project ./Api.Data/Api.Data.csproj && dotnet run --project ./Api.Application/Api.Aplication.csproj"
    networks:
      - app-network

  frontend:
    image: node:23
    container_name: frontend
    working_dir: /app
    restart: always
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
